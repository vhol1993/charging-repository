<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>EV Charging Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    .card { border: 1px solid #ccc; padding: 15px; border-radius: 8px; max-width: 400px; margin: auto; }
    input, select { width: 140px; height: 35px; font-size: 18px; margin: 8px; padding: 5px; }
    .finish-time { 
      font-weight: bold; 
      font-size: 22px; 
      color: #333; 
      text-align: center; 
      margin-top: 15px; 
    }
  </style>
</head>
<body>
  <h1>
    <img src="icon.png" alt="EV Icon" style="height:40px; vertical-align:middle; margin-right:10px;">
    EV Charging Dashboard
  </h1>

  <!-- Dropdown to select car -->
  <label for="carSelect">Qual Carro?:</label>
  <select id="carSelect" onchange="render()">
    <option value="0">Smurfy</option>
    <option value="1">Rudolph</option>
  </select>

  <div id="dashboard"></div>

  <script>
    const cars = [
      { name: "Smurfy", soc: 50, current: 15, voltage: 220, capacity: 39, limit: 90 },
      { name: "Rudolph", soc: 50, current: 15, voltage: 220, capacity: 64, limit: 90 }
    ];

    function formatTime(hoursRemaining) {
      const totalMinutes = Math.round(hoursRemaining * 60);
      const h = Math.floor(totalMinutes / 60);
      const m = totalMinutes % 60;
      return `${h}h ${m}m`;
    }

    function render() {
      const idx = document.getElementById("carSelect").value;
      const car = cars[idx];

      // Remaining capacity until charge limit
      const targetCapacity = car.capacity * (car.limit/100);
      const currentCapacity = car.capacity * (car.soc/100);
      const remainingCapacity = Math.max(targetCapacity - currentCapacity, 0);

      // Charging power
      const chargingPower = (car.voltage * car.current) / 1000; // kW
      const hoursRemaining = chargingPower > 0 ? (remainingCapacity / chargingPower) : 0;

      // Finish time
      const finishTime = new Date(Date.now() + hoursRemaining*3600*1000);

      const dashboard = document.getElementById("dashboard");
      dashboard.innerHTML = `
        <div class="card">
          <h2>${car.name}</h2>
          <label>Estado de Carga (%): 
            <input type="number" value="${car.soc}" 
              onchange="updateCar(${idx}, 'soc', this.value)">
          </label><br>
          <label>Corrente (A): 
            <input type="number" value="${car.current}" 
              onchange="updateCar(${idx}, 'current', this.value)">
          </label><br>
          <label>Limite de Carga (%): 
            <input type="number" value="${car.limit}" 
              onchange="updateCar(${idx}, 'limit', this.value)">
          </label><br>
          <p>Voltagem: ${car.voltage} V</p>
          <p>Capacidade da Bateria: ${car.capacity} kWh</p>
          <p>Capacidade Restante ate o Limite: ${remainingCapacity.toFixed(2)} kWh</p>
          <p>Potencia de Carga: ${chargingPower.toFixed(2)} kW</p>
          <p>Tempo Restante: ${formatTime(hoursRemaining)}</p>
          <p class="finish-time">Hora Estimada de Termino: ${finishTime.toLocaleTimeString()}</p>
        </div>
      `;
    }

    function updateCar(idx, field, value) {
      cars[idx][field] = parseFloat(value);
      render();
    }

    // Initial render
    render();
  </script>
</body>
</html>
